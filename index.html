<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZEYRWARE">
<title>ZEYRWARE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #06070a;
    color: #e0e6f0;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .bg {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(16,180,255,0.15), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(168,85,247,0.15), transparent 50%),
                linear-gradient(135deg, #06070a 0%, #0b0f1a 100%);
    z-index: -1;
  }
  .glow {
    position: fixed; top: 50%; left: 50%;
    width: 500px; height: 500px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(16,180,255,0.15) 0%, transparent 70%);
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } }

  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(12, 15, 22, 0.95);
    border: 1px solid rgba(16, 180, 255, 0.25);
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(16,180,255,0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .logo {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #10b4ff, #a855f7, #10b4ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .sub {
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    color: #556;
    margin-top: 6px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .input-group { margin-bottom: 16px; }
  .input-group label {
    display: block;
    font-size: 11px;
    color: #667;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .input-wrap { position: relative; display: flex; align-items: center; }
  input[type="text"] {
    width: 100%;
    padding: 16px 50px 16px 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    letter-spacing: 1px;
    outline: none;
    transition: all 0.3s;
    font-family: -apple-system, monospace;
  }
  input[type="text"]:focus {
    border-color: rgba(16, 180, 255, 0.6);
    background: rgba(16, 180, 255, 0.05);
    box-shadow: 0 0 20px rgba(16,180,255,0.15);
  }
  input[type="text"]::placeholder { color: #445; }
  input[readonly] { color: #667; cursor: default; }
  .paste-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(16, 180, 255, 0.15);
    border: 1px solid rgba(16, 180, 255, 0.3);
    color: #10b4ff;
    font-size: 11px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .paste-btn:active { transform: translateY(-50%) scale(0.95); background: rgba(16,180,255,0.25); }

  .activate {
    width: 100%;
    margin-top: 8px;
    padding: 16px;
    background: linear-gradient(135deg, #10b4ff 0%, #0088cc 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(16,180,255,0.3);
    transition: all 0.2s;
    font-family: inherit;
    text-transform: uppercase;
  }
  .activate:active { transform: scale(0.97); box-shadow: 0 4px 15px rgba(16,180,255,0.4); }
  .activate:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-5px);
    transition: all 0.4s;
  }
  .status.show { opacity: 1; transform: translateY(0); }
  .status.success {
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.35);
    color: #4ade80;
  }
  .status.error {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: #f87171;
  }

  .device-info {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 10px;
    color: #445;
    text-align: center;
    letter-spacing: 1.5px;
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .success-screen {
    display: none;
    text-align: center;
    padding: 20px 0;
  }
  .success-screen.show { display: block; }
  .success-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: pop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .success-title {
    font-size: 22px;
    font-weight: 800;
    color: #4ade80;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .success-sub {
    font-size: 13px;
    color: #667;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="glow"></div>

<div class="wrap">
  <div class="card">

    <!-- ACTIVATION FORM -->
    <div id="formScreen">
      <div class="logo">ZEYRWARE</div>
      <div class="sub">Premium Activation</div>

      <div class="input-group">
        <label>Device UID</label>
        <div class="input-wrap">
          <input type="text" id="deviceId" readonly>
          <button class="paste-btn" onclick="copyId()">COPY</button>
        </div>
      </div>

      <div class="input-group">
        <label>License Key</label>
        <div class="input-wrap">
          <input type="text" id="keyInput" placeholder="zeyrware/000000000" autocomplete="off" spellcheck="false">
          <button class="paste-btn" onclick="pasteKey()">PASTE</button>
        </div>
      </div>

      <button class="activate" id="activateBtn" onclick="activate()">
        ACTIVATE
      </button>

      <div class="status" id="status"></div>

      <div class="device-info" id="deviceInfo"></div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="successScreen" class="success-screen">
      <div class="success-icon">✓</div>
      <div class="success-title">ACTIVATED</div>
      <div class="success-sub">License activated successfully</div>
    </div>

  </div>
</div>

<script>
  // ============================================================
  // KEY VERIFICATION SYSTEM
  // ============================================================
  
  // Geçerli key'ler burada (sen ekleyeceksin)
  const VALID_KEYS = [
    "zeyrware/004401111",
    "zeyrware/004401112",
    "zeyrware/004401113",
    "zeyrware/004401114",
    "zeyrware/004401115",
  ];

  // ============================================================
  // DEVICE UID
  // ============================================================
  function getDeviceUID() {
    let uid = localStorage.getItem('zw_uid');
    if (!uid) {
      uid = '00' + Math.floor(1000000 + Math.random() * 8999999).toString();
      localStorage.setItem('zw_uid', uid);
    }
    return uid;
  }

  function isKeyUsedByDevice(key) {
    const usedData = localStorage.getItem('zw_used_keys');
    if (!usedData) return false;
    const used = JSON.parse(usedData);
    return used.includes(key);
  }

  function markKeyAsUsed(key, uid) {
    let usedData = localStorage.getItem('zw_used_keys');
    let used = usedData ? JSON.parse(usedData) : [];
    if (!used.includes(key)) {
      used.push(key);
      localStorage.setItem('zw_used_keys', JSON.stringify(used));
    }
    localStorage.setItem('zw_bound_key', key);
    localStorage.setItem('zw_bound_uid', uid);
    localStorage.setItem('zw_activated', 'true');
    localStorage.setItem('zw_activated_at', Date.now().toString());
  }

  function isAlreadyActivated() {
    return localStorage.getItem('zw_activated') === 'true';
  }

  function getBoundKey() {
    return localStorage.getItem('zw_bound_key');
  }

  // ============================================================
  // SAYFA YÜKLENDİĞİNDE
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    const uid = getDeviceUID();
    document.getElementById('deviceId').value = uid;
    document.getElementById('deviceInfo').textContent = 'UID: ' + uid + ' | ZEYRWARE v4.6';

    if (isAlreadyActivated()) {
      showSuccessScreen();
    }
  });

  function copyId() {
    const id = document.getElementById('deviceId');
    id.select();
    id.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(id.value).catch(() => {});
    showStatus('UID copied to clipboard', 'success');
  }

  function pasteKey() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(text => {
        document.getElementById('keyInput').value = text.trim();
      }).catch(() => {
        showStatus('Paste manually', 'error');
      });
    } else {
      showStatus('Paste manually', 'error');
    }
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status show ' + type;
  }

  function hideStatus() {
    const el = document.getElementById('status');
    el.className = 'status';
  }

  function activate() {
    const uid = getDeviceUID();
    const key = document.getElementById('keyInput').value.trim();
    const btn = document.getElementById('activateBtn');

    hideStatus();

    if (!key) {
      showStatus('Please enter a license key', 'error');
      return;
    }

    if (isAlreadyActivated()) {
      const boundKey = getBoundKey();
      if (boundKey === key) {
        showSuccessScreen();
        return;
      } else {
        showStatus('Device already activated with another key', 'error');
        return;
      }
    }

    if (!VALID_KEYS.includes(key)) {
      showStatus('Invalid license key', 'error');
      return;
    }

    if (isKeyUsedByDevice(key)) {
      showStatus('This key has already been used', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>ACTIVATING...';

    setTimeout(() => {
      markKeyAsUsed(key, uid);
      showSuccessScreen();
    }, 1500);
  }

  function showSuccessScreen() {
    document.getElementById('formScreen').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');
  }
</script>
</body>
</html>
